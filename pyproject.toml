[project]
name = "journalbot"
version = "0.1.0"
description = "Private Telegram journaling bot: nightly check-in, daily summary, weekly and monthly recaps."
requires-python = ">=3.12"
dependencies = ["python-telegram-bot>=21", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
